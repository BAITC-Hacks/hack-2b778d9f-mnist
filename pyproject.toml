[project]
name = "meeting-protocol"
version = "0.1.0"
description = "Local multilingual meeting protocols for HackAlem AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3", "pydantic-settings>=2.3,<3", "httpx>=0.27,<1", "PyYAML>=6,<7", "python-dotenv>=1,<2", "python-multipart>=0.0.18", "python-docx>=1.1,<2", "reportlab>=4.2,<5"]
[project.optional-dependencies]
models = ["faster-whisper>=1.1,<2", "pyannote.audio>=3.4,<4", "soundfile>=0.13"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1", "mypy>=1.10,<2", "pypdf>=5,<7"]
[project.scripts]
meeting-protocol = "meeting_protocol.__main__:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/meeting_protocol"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "meeting_protocol/prompt_templates"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
files = ["src/meeting_protocol"]
